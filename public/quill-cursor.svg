<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Quill feather — nib tip at bottom-left (hotspot 4,28) -->
  <!-- Shaft -->
  <line x1="4" y1="28" x2="26" y2="4" stroke="#d4af6a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Feather vane left -->
  <path d="M26,4 Q18,10 8,22 L4,28 Q10,20 20,12 Z" fill="#f0d089" fill-opacity="0.85" stroke="#c9a84c" stroke-width="0.6"/>
  <!-- Feather vane right (lighter) -->
  <path d="M26,4 Q22,8 16,16 L4,28 Q12,18 18,10 Z" fill="#e8c76a" fill-opacity="0.5" stroke="none"/>
  <!-- Feather midrib -->
  <line x1="4" y1="28" x2="26" y2="4" stroke="#a07830" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Nib tip dot -->
  <circle cx="4" cy="28" r="1.2" fill="#2b1a08"/>
</svg>
